name: Study Spark Bot 24x7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: study-spark-bot-single
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Fast Engines
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 build-essential python3-dev
          pip install -U pip wheel setuptools
          pip install --no-binary :all: tgcrypto || pip install tgcrypto
          pip install -r requirements.txt

      - name: Unlock 32x Workers & Queue(128) Turbo Patch
        run: |
          python3 -c '
          import pyrogram.methods.advanced.save_file as sf, inspect
          p_sf = inspect.getfile(sf)
          c = open(p_sf).read()
          c = c.replace("workers_count = 4 if is_big else 1", "workers_count = 32 if is_big else 8")
          c = c.replace("queue = asyncio.Queue(1)", "queue = asyncio.Queue(128)")
          open(p_sf, "w").write(c)
          print("Pyrogram 32-Worker Queue(128) Turbo Patch Applied!")

          p = open("bot.py").read()
          p = p.replace("\"-s\", \"16\",", "\"-s\", \"64\", \"--file-allocation=none\", \"--disk-cache=128M\",")
          p = p.replace("\"--hls-prefer-native\",", "\"--external-downloader\", \"aria2c\", \"--external-downloader-args\", \"aria2c:-x 16 -s 64 -j 32 -k 1M --file-allocation=none --disk-cache=128M\",")
          p = p.replace("no_updates=True", "no_updates=True, workers=32, max_concurrent_transmissions=8, sleep_threshold=180")
          open("bot.py", "w").write(p)
          '

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python3 bot.py
