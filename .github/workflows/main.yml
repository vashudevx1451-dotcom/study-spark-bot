name: Study Spark Bot 24x7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: study-spark-bot-single
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Fast Engines
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 build-essential python3-dev
          pip install -U pip wheel setuptools
          pip install --no-binary :all: tgcrypto || pip install tgcrypto
          pip install -r requirements.txt

      - name: Patch Pyrogram for 8 Independent Upload Sockets (Zero FloodWait)
        run: |
          python3 -c '
          import pyrogram.methods.advanced.save_file as sf, inspect
          p_sf = inspect.getfile(sf)
          c = open(p_sf).read()
          old_b = """            session = Session(
                self, await self.storage.dc_id(), await self.storage.auth_key(),
                await self.storage.test_mode(), is_media=True
            )
            workers = [self.loop.create_task(worker(session)) for _ in range(workers_count)]
            queue = asyncio.Queue(1)

            try:
                await session.start()"""
          new_b = """            num_s = 8 if is_big else 1
            sessions = [
                Session(
                    self, await self.storage.dc_id(), await self.storage.auth_key(),
                    await self.storage.test_mode(), is_media=True
                ) for _ in range(num_s)
            ]
            workers = []
            queue = asyncio.Queue(64)

            try:
                await asyncio.gather(*(s.start() for s in sessions))
                workers = [self.loop.create_task(worker(sessions[i % num_s])) for i in range(workers_count)]"""
          c = c.replace("workers_count = 4 if is_big else 1", "workers_count = 16 if is_big else 2")
          c = c.replace(old_b, new_b)
          c = c.replace("await session.stop()", "await asyncio.gather(*(s.stop() for s in sessions), return_exceptions=True)")
          open(p_sf, "w").write(c)
          print("8-Socket Parallel Upload Patch Applied Successfully!")
          '

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python3 bot.py
